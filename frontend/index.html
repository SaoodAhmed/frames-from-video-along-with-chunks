<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KENDUIT — Video Upload</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🗂️%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/frameforge.css" />
</head>
<body>
  <!-- Auth view -->
  <div id="view-auth" class="auth-wrap">
    <div class="card auth-card">
      <div class="brand" style="padding:0 0 16px;">
        <span class="logo">KEN<span class="accent">DUIT</span></span>
        <span class="ver">v3.1 web</span>
      </div>
      <div class="auth-tabs">
        <button id="tab-login" class="active" type="button">Login</button>
        <button id="tab-register" type="button">Register</button>
      </div>

      <form id="auth-form">
        <div class="field">
          <label for="auth-email">Email</label>
          <input id="auth-email" class="input" type="email" autocomplete="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <input id="auth-password" class="input" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>
        <button class="btn block" id="auth-submit" type="submit">Login</button>
        <div class="auth-err" id="auth-err"></div>
      </form>
    </div>
  </div>

  <!-- App view -->
  <div id="view-app" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">KEN<span class="accent">DUIT</span></span>
        <span class="ver">v3.1 web</span>
      </div>
      <div class="sidebar-head">Folders</div>
      <div class="nav">
        <button class="nav-item active" data-folder-id="" type="button">
          <span class="nav-icon">🗂️</span><span>All Media</span>
        </button>
        <div id="folder-tree"></div>
      </div>
      <div class="sidebar-footer">
        <button class="btn ghost small block" id="btn-new-folder" type="button">+ New folder</button>
        <div class="user-email" id="user-email"></div>
        <button class="btn ghost small block" id="btn-logout" type="button">Log out</button>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="toolbar-titles">
          <h1 id="view-title">All Media</h1>
          <nav class="breadcrumb" id="breadcrumb"></nav>
        </div>
        <span class="toolbar-note" id="library-note">—</span>
        <div class="tabs" id="media-tabs">
          <button data-type="all" class="active" type="button">All</button>
          <button data-type="image" type="button">Images</button>
          <button data-type="video" type="button">Videos</button>
        </div>
        <div class="spacer"></div>
        <input id="gallery-search" class="input search-box" type="text" placeholder="Search media…" />
        <button class="btn" id="btn-upload" type="button">+ Upload</button>
      </div>

      <!-- Selection bar -->
      <div id="selection-bar" class="selection-bar hidden">
        <span id="sel-count">0 selected</span>
        <div class="spacer"></div>
        <button class="btn ghost small" id="sel-all" type="button">Select all</button>
        <button class="btn ghost small" id="sel-none" type="button">Deselect</button>
        <button class="btn small" id="sel-download" type="button">Download</button>
        <button class="btn small" id="sel-zip" type="button">ZIP</button>
        <button class="btn small danger" id="sel-delete" type="button">Delete</button>
      </div>

      <!-- Upload panel -->
      <div id="upload-panel" class="card hidden mb-20">
        <div class="upload-actions">
          <label class="btn ghost" for="file-input">Upload Files</label>
          <label class="btn ghost" for="folder-input">Upload Folder</label>
        </div>
        <input id="file-input" type="file" class="hidden" multiple accept="video/*,.mp4,.mov,.m4v,.avi,.mkv,.webm,.ogv,.ogg,.3gp,.3g2,.flv,.wmv,.mpg,.mpeg,.ts,.m2ts,.mts,.mxf,.mp2,.ogm,.divx,.asf,.vob,.m2v,.mpe,image/*,.jpg,.jpeg,.png,.webp,.avif,.gif,.bmp,.tiff,.tif,.heic,.heif" />
        <input id="folder-input" type="file" class="hidden" multiple webkitdirectory />
        <div id="dropzone" class="dropzone">
          <div class="dz-title">Drag &amp; Drop files or a whole folder here</div>
          <div class="dz-sub">images + videos · saves into <b id="upload-folder-label">All Media</b> · duplicates are skipped automatically</div>
        </div>
        <div id="upload-batch" class="hidden mt-12"></div>
        <div class="auth-err" id="upload-err"></div>
      </div>

      <div id="videos-empty" class="empty-state">
        <div class="empty-icon">🗂️</div>
        <div id="empty-text">No media yet. Upload files or a folder and they'll appear here.</div>
        <div class="empty-cta"><button class="btn" id="empty-upload" type="button">+ Upload your first media</button></div>
      </div>
      <div id="gallery" class="gallery media-gallery hidden"></div>
      <div id="gallery-pager" class="pager hidden"></div>

      <!-- Preview modal -->
      <div id="preview-modal" class="preview-modal hidden">
        <div class="modal-backdrop" id="preview-backdrop"></div>
        <div class="preview-shell">
          <button class="preview-close" id="preview-close" type="button" aria-label="Close">✕</button>
          <button class="preview-nav prev" id="preview-prev" type="button" aria-label="Previous">‹</button>
          <div class="preview-body" id="preview-body"></div>
          <button class="preview-nav next" id="preview-next" type="button" aria-label="Next">›</button>
          <div class="preview-caption" id="preview-caption"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>
  <script src="/js/api.js"></script>
  <script src="/js/sha256.js"></script>
  <script src="/js/user.js"></script>
</body>
</html>
